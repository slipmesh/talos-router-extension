# Overlaid onto a siderolabs/extensions checkout (see Makefile's checkout-extensions
# target) at router/pkg.yaml. No kernel module involved - router is pure userspace (the
# `router` binary supervising a bundled `bird`), so unlike ../talos-awg-extension this
# package has no `dependencies: [image: ...]` on anything from ../talos-kernel at all -
# it's fully independent of that repo.
#
# BIRD is built from source here with the *same* `--disable-client` flag
# siderolabs/extensions' own network/bird2 package uses - despite the module being named
# `birdc.rs`, ../talos-extensions/router doesn't shell out to the `birdc` CLI binary at
# all (see that file's own doc comment): it's a from-scratch client for BIRD's control-
# socket wire protocol, talking to /run/bird.ctl directly over a Unix socket. So there's
# no need to build the actual `birdc` tool (which needs GNU Readline - confirmed the hard
# way: `configure` fails without either Readline or --disable-client) - only the `bird`
# daemon binary itself. BIRD_VERSION/SHA256/SHA512 come in as --build-arg (see Makefile),
# same convention as amneziawg-pkg's AWG_REF in ../talos-kernel.
name: router
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
steps:
  - sources:
      - url: "https://gitlab.nic.cz/labs/bird/-/archive/v{{ .BUILD_ARG_BIRD_VERSION }}/bird-v{{ .BUILD_ARG_BIRD_VERSION }}.tar.gz"
        destination: bird.tar.gz
        sha256: "{{ .BUILD_ARG_BIRD_SHA256 }}"
        sha512: "{{ .BUILD_ARG_BIRD_SHA512 }}"
      # Mozilla's CA bundle, curl's own dated re-publication of it (curl.se's undated
      # cacert.pem is a moving target - the dated snapshot gives bldr's own
      # sha256/sha512 verification something stable to pin against, same reasoning as
      # BIRD_SHA256/SHA512 above). Needed because this build stage has neither a CA
      # trust store nor a package manager to install one with (both confirmed directly)
      # - see the `install` step below for why one's needed at all.
      - url: "https://curl.se/ca/cacert-2026-07-16.pem"
        destination: cacert.pem
        sha256: "3ff344e30b9b1ed2971044eabb438a08f2e2245ddb5f8ab1a3ad8b63ab4eaf91"
        sha512: "c7e70bca4d1af169bca97a313b56a90cd233a62b7ba47b531fa0bc2b0e7edaf964933d9777df8320b5b8e8769740b0c1dfd1d24edec574551121e172ea54b470"
    prepare:
      - |
        tar -xf bird.tar.gz --strip-components=1
      - |
        autoreconf -fi

        export CFLAGS="${CFLAGS} -I/usr/local/include -static"
        export LDFLAGS="${LDFLAGS} -static"

        ./configure --disable-client --prefix=/usr/local
    build:
      - |
        make -j $(nproc) all
    install:
      - |
        mkdir -p /rootfs/usr/local/lib/containers/router
        cp bird /rootfs/usr/local/lib/containers/router/bird

        install -m 0755 /pkg/router-bin /rootfs/usr/local/lib/containers/router/router
        mkdir -p /rootfs/usr/local/etc/containers
        cp /pkg/router-service.yaml /rootfs/usr/local/etc/containers/router.yaml

        # `variant: scratch` means the rootfs otherwise ships with no CA trust store at
        # all - `router`'s RIPEstat bypass resolver (reqwest + rustls-native-certs, reads
        # the system bundle off disk) needs one to make any HTTPS request whatsoever.
        # Without this, every RIPEstat call fails TLS verification against an empty root
        # store (confirmed directly against a deployed node). This build stage has
        # neither a CA store nor a package manager to install one with (both confirmed
        # directly - every conventional Linux path came up empty, and `apk`/`apt` are
        # both absent), hence fetching one ourselves above instead.
        mkdir -p /rootfs/etc/ssl/certs
        cp cacert.pem /rootfs/etc/ssl/certs/ca-certificates.crt
    test:
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
